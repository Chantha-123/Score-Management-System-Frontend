<div class="content-container" ng-controller="CreateRateController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.createrate' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cube"></i>
				<a href="#/products">{{'label.anchor.products' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-bar-chart-o"></i>
				<a href="#/rates">{{'label.anchor.rates' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-plus"></i> {{'label.anchor.createrate' | translate}}
		</div>
		<form name="createrateform" novalidate="" class="form-horizontal" rc-submit="submit()">
			<div ng-show="rateError" role="alert" style="color:red">{{'label.error.rate.already.exist' | translate}}</div>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.chargesappliesto' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="productApply" name="productApply" ng-model="formData.productApply" ng-options="productApply.id as productApply.id | translate for productApply in rateOptions" value="{{productApply.id}}" class="form-control" required>
							<option value="">{{'label.selectone' | translate}}</option>
						</select>
					</div>
					<div class="col-sm-2">
						<form-validate valattributeform="createrateform" valattribute="productApply"/>
					</div>
				</div>
				<hr/>
				<div ng-show="formData.productApply">
					<div class="form-group">
						<label class="control-label col-sm-3" for="name">{{'label.input.name' | translate}}<span class="required">*</span></label>
						<div class="col-sm-4">
							<input name="name" type="text" id="name" ng-model="formData.name" class="form-control" required late-Validate/>
						</div>
						<div class="col-sm-3">
							<form-validate valattributeform="createrateform" valattribute="name"/>
						</div>
					</div>
					<div class="form-group">
						<label class="control-label col-sm-3" for="percentage">{{'label.input.percentage' | translate}}<span class="required">*</span></label>
						<div class="col-sm-4">
							<input id="percentage" name="percentage" type="text" number-format ng-model="formData.percentage" class="form-control" required late-Validate/>
						</div>
						<div class="col-sm-3">
							<form-validate valattributeform="createrateform" valattribute="percentage"/>
						</div>
					</div>
					<div class="form-group">
						<label class="control-label col-sm-3" for="active">{{'label.input.active' | translate}}</label>
						<div class="col-sm-4">
							<label class="checkbox">
								<input id="active" type="checkbox" ng-model="formData.active" data-ng-change="setChoice()">
							</label>
						</div>
					</div>
					<div class="ca-form-actions">
						<a href="#/rates">
							<button type="reset" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</button>
						</a>
						<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='CREATE_RATE'>{{'label.button.save' | translate}}</button>
					</div>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
