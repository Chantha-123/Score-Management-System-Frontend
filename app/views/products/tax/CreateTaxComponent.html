<div class="content-container" ng-controller="CreateTaxComponentController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.createtaxcomponent' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cube"></i>
				<a href="#/products">{{'label.anchor.products' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-percent"></i>
				<a href="#/taxconfiguration">{{'label.anchor.managetaxconfigurations' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-building"></i>
				<a href="#/taxcomponents">{{'label.anchor.managetaxcomponents' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-plus"></i> {{'label.heading.createtaxcomponent' | translate}}
		</div>
		<form name="createtaxcomponentform" novalidate="" class="form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.name' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="name" ng-autofocus="true" type="text" name="name" ng-model="formData.name" class="form-control" required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="createtaxcomponentform" valattribute="name"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.percentage' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="percentage" type="text" name="percentage" ng-model="formData.percentage" class="form-control" number-format required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="createtaxcomponentform" valattribute="percentage"/>
					</div>
				</div>
				<div class="form-group" ng-show="false">
					<label class="control-label col-sm-3">{{'label.input.debitaccounttype' | translate}}</label>
					<div class="col-sm-4">
						<select id="debitAccountType" ng-model="formData.debitAccountType" ng-options="accountType.id as accountType.value for accountType in data.glAccountTypeOptions" value="{{accountType.id}}" class="form-control" data-ng-change="populateDebitAccount()"></select>
					</div>
				</div>
				<div class="form-group" ng-show="false">
					<label class="control-label col-sm-3">{{'label.input.debitaccount' | translate}}</label>
					<div class="col-sm-4">
						<select id="debitAcountId" ng-model="formData.debitAcountId" class="form-control" chosen="debitaccounts" ng-options="account.id as account.name for account in debitaccounts" value="{{account.id}}">
							<option value="">{{'label.select' | translate}}</option>
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.creditaccounttype' | translate}}</label>
					<div class="col-sm-4">
						<select id="creditAccountType" ng-model="formData.creditAccountType" ng-options="accountType.id as accountType.value for accountType in data.glAccountTypeOptions" value="{{accountType.id}}" class="form-control" data-ng-change="populateCreditAccount()"></select>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.creditaccount' | translate}}</label>
					<div class="col-sm-4">
						<select id="creditAcountId" ng-model="formData.creditAcountId" class="form-control" chosen="creditaccounts" ng-options="account.id as account.name for account in creditaccounts" value="{{account.id}}">
							<option value="">{{'label.select' | translate}}</option>
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.startdate' | translate}}</label>
					<div class="col-sm-4">
						<input id="startDate" sort type="text" datepicker-pop="dd MMMM yyyy" ng-model="start.date" class="form-control" is-open="opened" min="minDate" max="restrictDate"/>
					</div>
				</div>
				<div class="ca-form-actions">
					<a href="#/taxcomponents" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='CREATE_TAXCOMPONENT'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
