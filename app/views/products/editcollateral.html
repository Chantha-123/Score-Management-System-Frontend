<div class="content-container" ng-controller="EditCollateralController">
	<api-validate></api-validate>

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.editCollateral' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cube"></i>
				<a href="#/products">{{'label.anchor.products' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-lock"></i>
				<a href="#/collaterals">{{'label.anchor.collaterals' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-pencil"></i> {{'label.heading.editcollateral' | translate}}
		</div>
		<form name="editcollateralform" novalidate class="form-horizontal" rc-submit="submit()">
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3" for="name">{{'label.input.name' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input name="name" ng-autofocus="true" type="text" id="name" ng-model="formData.name" class="form-control" required late-Validate/>
						<form-validate valattributeform="editcollateralform" valattribute="name"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.type' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="type" name="type" type="text" class="form-control" ng-model="formData.type" required late-validate>
					</div>
					<div class="col-sm-2">
						<form-validate valattributeform="editcollateralform" valattribute="type"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3" for="unitType">{{'label.input.unittype' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="unitType" class="form-control" ng-model="formData.unitType" required late-validate>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="editcollateralform" valattribute="unitType"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3" for="basePrice">{{'label.input.baseprice' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="basePrice" name="basePrice" type="text" ng-model="formData.basePrice" class="form-control" number-format required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="editcollateralform" valattribute="basePrice"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3" for="currency">{{'label.input.currency' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="currency" name="currency" ng-model="formData.currency" class="form-control" ng-options="currency.code as currency.name for currency in currencyOptions" value="{{currency.code}}"></select>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="editcollateralform" valattribute="currency"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3" for="pctToBase">{{'label.input.pcttobase' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="pctToBase" name="pctToBase" type="text" ng-model="formData.pctToBase" class="form-control" number-format required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="editcollateralform" valattribute="pctToBase"/>
					</div>
				</div>
				<div class="ca-form-actions">
					<a href="#/viewcollateral/{{collateralId}}" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='UPDATE_COLLATERAL_PRODUCT'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
