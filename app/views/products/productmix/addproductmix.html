<div class="content-container" ng-controller="AddProductMixController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.addproductmix' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cube"></i>
				<a href="#/products">{{'label.anchor.products' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-random"></i>
				<a href="#/productmix">{{'label.anchor.productmix' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-plus"></i> {{'label.heading.addproductmix' | translate}}
		</div>
		<form name="addproductmixform" novalidate class="form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.selectproduct' | translate}}</label>
					<div class="col-sm-4">
						<select id="productId" name="product" ng-model="formData.productId" ng-options="product.id as product.name for product in products" value="{{product.id}}" data-ng-change="productInfo(formData.productId)" class="form-control" required>
							<option value="">{{'label.selectproduct' | translate}}</option>
						</select>
						<form-validate valattributeform="addproductmixform" valattribute="product"/>
					</div>
				</div>
				<div class="form-group">
					<div class="row" data-ng-show="formData.productId">
						<div class="col-sm-3 col-md-3 col-md-offset-1">
							<label class="control-label col-sm-9">{{'label.input.allowedproducts' | translate}}</label>
							<select multiple ng-model="allowed" class="form-control clear multiselectmin">
								<option ng-repeat="allowedProduct in allowedProducts" value="{{allowedProduct.id}}">{{allowedProduct.name}}</option>
							</select>
						</div>
						<div class="col-sm-1 col-md-1 paddedtop25px">
							<button type="button" class="btn btn-primary" data-ng-click="restrict()"><i class="fa fa-angle-double-right"></i></button>
							<br/>
							<button type="button" class="btn btn-primary" data-ng-click="allow()"><i class="fa fa-angle-double-left"></i></button>
						</div>
						<div class="col-sm-3 col-md-3">
							<label class="control-label col-sm-9">{{'label.input.restrictedproducts' | translate}}</label>
							<select multiple ng-model="restricted" class="form-control clear multiselectmin">
								<option ng-repeat="restrictedProduct in restrictedProducts" value="{{restrictedProduct.id}}">{{restrictedProduct.name}}</option>
							</select>
						</div>
					</div>
				</div>
				<div class="ca-form-actions">
					<a href="#/productmix" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='CREATE_PRODUCTMIX'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
