<div class="content-container">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.heading.guarantor' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-shield"></i>
				<a href="#/listguarantors/{{template.loanId}}">{{'label.anchor.guarantordetails' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">

		<form class="form-horizontal" name="editguaratorform" novalidate=""
			ng-controller="EditGuarantorController" rc-submit="submit()">
			<api-validate></api-validate>

			<div class="ca-section-heading" style="margin-top:0;">
				<i class="fa fa-user"></i> {{ 'label.input.relationship' | translate }}
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.relationship' | translate }}</label>
				<div class="col-sm-4">
					<select id="relationshipType" ng-model="formData.relationshipType"
							ng-options="type.id as type.name for type in template.allowedClientRelationshipTypes"
							value="{{type.id}}" class="form-control">
						<option value="">{{'label.selectone' | translate}}</option>
					</select>
				</div>
			</div>

			<div class="ca-section-heading">
				<i class="fa fa-id-card-o"></i> {{ 'label.heading.personaldetails' | translate }}
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="firstname">{{ 'label.input.firstname' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input type="text" id="firstname" name="firstname" ng-model="formData.firstname" class="form-control" required late-Validate/>
					<form-validate valattributeform="editguaratorform" valattribute="firstname"/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.lastname' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input id="lastname" name="lastname" type="text" ng-model="formData.lastname" class="form-control" required late-Validate/>
					<form-validate valattributeform="editguaratorform" valattribute="lastname"/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.dob' | translate }}</label>
				<div class="col-sm-4">
					<input id="dob" type="text" datepicker-pop="dd MMMM yyyy" ng-model="date.first" is-open="opened"
						   min="minDate" max="restrictDate" class="form-control"/>
				</div>
			</div>

			<div class="ca-section-heading">
				<i class="fa fa-map-marker"></i> {{ 'label.input.address' | translate }}
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.address' | translate }}</label>
				<div class="col-sm-4">
					<input id="addressline1" type="text" placeholder="Line 1" ng-model="formData.addressLine1" class="form-control">
					<input id="addressline2" type="text" placeholder="Line 2" ng-model="formData.addressLine2" class="form-control" style="margin-top:6px;">
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.city' | translate }}</label>
				<div class="col-sm-4">
					<input id="city" type="text" ng-model="formData.city" class="form-control">
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.zip' | translate }}</label>
				<div class="col-sm-4">
					<input id="zip" type="text" ng-model="formData.zip" class="form-control">
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.mobile' | translate }}</label>
				<div class="col-sm-4">
					<input id="mobile" type="text" ng-model="formData.mobile" class="form-control">
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.residence' | translate }}</label>
				<div class="col-sm-4">
					<input id="residence" type="text" ng-model="formData.residence" class="form-control">
				</div>
			</div>

			<div class="ca-form-actions">
				<a id="cancel" href="#/listguarantors/{{template.loanId}}" class="btn btn-default btn-sm">{{ 'label.button.cancel' | translate }}</a>
				<button id="save" type="submit" has-permission='UPDATE_GUARANTOR' class="btn btn-primary btn-sm">{{ 'label.button.save' | translate }}</button>
			</div>

		</form>

	</div><!-- /.ca-card -->

</div>
