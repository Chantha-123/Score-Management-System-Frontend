<div class="content-container" ng-controller="LoanDocumentController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.heading.uploaddocument' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-file-text-o"></i>
				<a href="#/viewloanaccount/{{loanId}}">{{'label.anchor.viewloanaccount' | translate}}</a>
			</span>
		</div>
	</div>

	<api-validate></api-validate>

	<div class="ca-card">

		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-upload"></i> {{'label.heading.uploaddocument' | translate}}
		</div>

		<form class="form-horizontal" name="loandocumentform" novalidate="" ng-submit="submit()">

			<div class="form-group">
				<label class="control-label col-sm-3" for="name">{{'label.input.name' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input id="name" type="text" name="name" ng-model="formData.name" class="form-control" required late-Validate/>
					<form-validate valattributeform="loandocumentform" valattribute="name"/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="description">{{'label.input.description' | translate}}</label>
				<div class="col-sm-4">
					<textarea rows="2" id="description" ng-model="formData.description" class="form-control"></textarea>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="file">{{'label.input.selectfile' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input id="file" type="file" ngf-select="onFileSelect($files)">
				</div>
			</div>

			<div class="ca-form-actions">
				<a id="cancel" href="#/viewloanaccount/{{loanId}}">
					<button type="reset" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</button>
				</a>
				<button id="save" type="submit" ng-disabled="!loandocumentform.$valid" has-permission='CREATE_DOCUMENT' class="btn btn-primary btn-sm">
					{{'label.button.save' | translate}}
				</button>
			</div>

		</form>

	</div><!-- /.ca-card -->

</div>
