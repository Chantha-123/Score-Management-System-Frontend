<div class="content-container" ng-controller="AssignLoanOfficerController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{ 'label.heading.assignloanofficer' | translate }}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-file-text-o"></i>
				<a href="#/viewloanaccount/{{loanId}}">{{'label.anchor.viewloanaccount' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">

		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-user"></i> {{ 'label.heading.assignloanofficer' | translate }}
		</div>

		<form class="form-horizontal" name="assignloanofficerform" novalidate="" ng-submit="submit()">
			<api-validate></api-validate>

			<div class="form-group">
				<label class="control-label col-sm-3" for="toLoanOfficerId">{{ 'label.input.toloanofficer' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select class="form-control" id="toLoanOfficerId" ng-model="formData.toLoanOfficerId"
							ng-options="loanOfficer.id as loanOfficer.displayName for loanOfficer in loanOfficers"
							value="{{loanOfficer.id}}"></select>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="assignmentDate">{{ 'label.input.assignmentdate' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input class="form-control" id="assignmentDate" type="text" datepicker-pop="dd MMMM yyyy"
						   ng-model="formData.assignmentDate" is-open="opened" max="restrictDate"/>
				</div>
			</div>

			<div class="ca-form-actions">
				<button id="cancel" type="reset" class="btn btn-default btn-sm" ng-click="cancel()">{{ 'label.button.cancel' | translate }}</button>
				<button id="save" type="submit" ng-disabled="!assignloanofficerform.$valid" has-permission='BULKREASSIGN_LOAN' class="btn btn-primary btn-sm">{{ 'label.button.save' | translate }}</button>
			</div>

		</form>

	</div><!-- /.ca-card -->

</div>
