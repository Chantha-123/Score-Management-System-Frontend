<div class="col-md-12" ng-controller="LoanForeclosureController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.heading.loan.foreclosure' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-file-text-o"></i>
				<a href="#/viewloanaccount/{{accountId}}">{{'label.anchor.viewloanaccount' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">

		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-calendar"></i> {{'label.input.transactiondate' | translate}}
		</div>

		<form class="form-horizontal" novalidate="" name="foreclosureform" rc-submit="submit()">
			<api-validate></api-validate>

			<div class="form-group">
				<label class="control-label col-sm-3">{{'label.input.transactiondate' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input id="transactionDate" name="transactionDate" class="form-control" type="text" datepicker-pop="dd MMMM yyyy"
						   ng-model="formData.transactionDate" max="restrictDate" is-open="opened"/>
				</div>
			</div>

			<div class="ca-section-heading">
				<i class="fa fa-bar-chart"></i> {{'label.heading.loanamountandbalance' | translate}}
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">Principal</label>
				<div class="col-sm-4">
					<input type="text" id="outstandingPrincipalPortion" name="outstandingPrincipalPortion" ng-model="formData.outstandingPrincipalPortion" class="form-control" number-format readonly/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">Interest</label>
				<div class="col-sm-4">
					<input type="text" id="outstandingInterestPortion" name="outstandingInterestPortion" ng-model="formData.outstandingInterestPortion" class="form-control" number-format readonly/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">Fee Amount</label>
				<div class="col-sm-4">
					<input type="text" id="outstandingFeeChargesPortion" name="outstandingFeeChargesPortion" ng-model="formData.outstandingFeeChargesPortion" class="form-control" number-format readonly/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">Penalty Amount</label>
				<div class="col-sm-4">
					<input type="text" id="outstandingPenaltyChargesPortion" name="outstandingPenaltyChargesPortion" ng-model="formData.outstandingPenaltyChargesPortion" class="form-control" number-format readonly/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">Transaction Amount</label>
				<div class="col-sm-4">
					<input type="text" ng-model="formData.transactionAmount" class="form-control" number-format readonly/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">Note</label>
				<div class="col-sm-4">
					<textarea id="note" type="text" rows="2" name="note" ng-model="formData.note" class="form-control"></textarea>
				</div>
			</div>

			<div class="ca-form-actions">
				<button id="cancel" type="reset" class="btn btn-default btn-sm" ng-click="cancel()">{{ 'label.button.cancel' | translate }}</button>
				<button id="save" type="submit" has-permission="FORECLOSURE_LOAN" class="btn btn-primary btn-sm">Foreclosure</button>
			</div>

		</form>

	</div><!-- /.ca-card -->

</div>
