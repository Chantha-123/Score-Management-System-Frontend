<div class="content-container" ng-controller="EditCodeController" ng-submit="submit()">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{code.name}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cog"></i>
				<a href="#/system">{{'label.anchor.system' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-tags"></i>
				<a href="#/codes">{{'label.anchor.managecodes' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-tag"></i>
				<a href="#/viewcode/{{codeId}}">{{code.name}}</a>
			</span>
		</div>
	</div>

	<api-validate></api-validate>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-pencil"></i> {{'label.anchor.addcodevalue' | translate}}
		</div>
		<form>
			<div class="row">
				<div class="col-sm-3">
					<input name="codevalue" ng-model="newEle.name" placeholder="{{'label.input.codevalue' | translate}}" type="text" class="form-control"/>
				</div>
				<div class="col-sm-3">
					<textarea name="description" ng-model="newEle.description" placeholder="{{'label.input.description' | translate}}" type="text" class="form-control"></textarea>
				</div>
				<div class="col-sm-3">
					<input name="position" ng-model="newEle.position" placeholder="{{'label.input.position' | translate}}" type="text" class="form-control"/>
				</div>
				<div class="col-sm-2">
					<label class="control-label">{{'label.input.active' | translate}}</label>
					<input id="activeCheckbox" type="checkbox" ng-model="newEle.isActive">
				</div>
				<div class="col-sm-2">
					<a data-ng-click="addCv()" class="btn btn-primary btn-sm" has-permission='CREATE_CODEVALUE'><i class="fa fa-plus"></i>&nbsp;{{'label.button.add' | translate}}</a>
				</div>
			</div>
		</form>
		<div data-ng-repeat="codevalue in codevalues">
			<input disabled="" placeholder={{codevalue.name}} type="text"/>&nbsp;&nbsp;
			<input disabled="" placeholder={{codevalue.description}} type="text"/>&nbsp;&nbsp;
			<input disabled="" placeholder={{codevalue.position}} type="text"/>&nbsp;&nbsp;
			<a ng-click='deleteCv(codevalue.id)' has-permission='DELETE_CODEVALUE'><i class="fa fa-times-circle fa-2x"></i></a>
		</div>
		<div class="pull-right" data-ng-show="stat">
			<p>{{'label.systemdefinedcodedeletefailed' | translate}}</p>
		</div>
	</div><!-- /.ca-card -->

</div>
