<div class="content-container" ng-controller="EditPasswordPreferencesController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.passwordPreferences' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cogs"></i>
				<a href="#/organization">{{'label.anchor.organization' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-lock"></i> {{'label.heading.passwordPreferences' | translate}}
		</div>
		<form class="form-horizontal" ng-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<div class="col-sm-offset-1 col-sm-8">
						<div ng-repeat="data in dataOptions" style="margin-bottom:6px;">
							<input type="radio" ng-model="formData.validationPolicyId" value={{data.id}}>
							&nbsp;{{'label.' + data.key | translate }}
						</div>
					</div>
				</div>
				<div class="ca-form-actions">
					<a href="#/organization" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button type="submit" class="btn btn-primary btn-sm" has-permission='UPDATE_PASSWORD_VALIDATION_POLICY'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
