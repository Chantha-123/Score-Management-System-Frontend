<div class="content-container" ng-controller="CreateVillageController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">Create Village</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cogs"></i>
				<a href="#/organization">{{'label.anchor.organization' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-map-marker"></i>
				<a href="#/villages">Manage Villages</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-plus-circle"></i> Create Village
		</div>
		<form name="createvillageform" novalidate="" class="form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">Commune<span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="communeId" chosen="communes" ng-model="formData.communeId" class="form-control"
							ng-options="commune.id as commune.nameEng for commune in communes"></select>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">Code<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="code" ng-autofocus="true" type="text" name="code" ng-model="formData.code" class="form-control" required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="createvillageform" valattribute="code"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">Name (Khmer)<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="nameKhm" type="text" name="nameKhm" ng-model="formData.nameKhm" class="form-control" required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="createvillageform" valattribute="nameKhm"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">Name (English)<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="nameEng" type="text" name="nameEng" ng-model="formData.nameEng" class="form-control" required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="createvillageform" valattribute="nameEng"/>
					</div>
				</div>
				<div class="ca-form-actions">
					<a id="cancel" href="#/villages" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='CREATE_VILLAGE'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
