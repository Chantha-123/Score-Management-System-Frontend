<div class="content-container" ng-controller="EditPaymentTypeController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.editpaymenttype' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cogs"></i>
				<a href="#/organization">{{'label.anchor.organization' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-credit-card"></i>
				<a href="#/viewpaymenttype">{{'label.heading.paymenttype' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-pencil"></i> {{'label.anchor.editpaymenttype' | translate}}
		</div>
		<form name="createpaymenttype" novalidate="" class="form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3" for="name">{{'label.anchor.paymentTypes' | translate}}</label>
					<div class="col-sm-4">
						<input type="text" id="name" name="name" ng-model="formData.name" class="form-control"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.description' | translate}}</label>
					<div class="col-sm-4">
						<textarea name="description" ng-model="formData.description" type="text" class="form-control"></textarea>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.iscashpayment' | translate}}</label>
					<div class="col-sm-4">
						<input type="checkbox" id="iscashpayment" ng-model="formData.isCashPayment">
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.position' | translate}}</label>
					<div class="col-sm-4">
						<input type="text" id="position" name="position" ng-model="formData.position" class="form-control"/>
					</div>
				</div>
				<div class="ca-form-actions">
					<a id="cancel" href="#/viewpaymenttype" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='UPDATE_PAYMENTTYPE'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
