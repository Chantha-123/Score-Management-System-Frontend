<div class="content-container" ng-controller="CreateOfficeController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.createoffice' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-cogs"></i>
				<a href="#/organization">{{'label.anchor.organization' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-building"></i>
				<a href="#/offices">{{'label.anchor.manageoffices' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-plus-circle"></i> {{'label.heading.createoffice' | translate}}
		</div>
		<form name="createofficeform" novalidate="" class="form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">{{ 'label.input.office' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="name" ng-autofocus="true" type="text" name="name" ng-model="formData.name" class="form-control" required late-Validate/>
					</div>
					<div class="col-sm-3">
						<form-validate valattributeform="createofficeform" valattribute="name"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{ 'label.input.parentoffice' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select chosen="offices" id="parentId" ng-model="formData.parentId" class="form-control" ng-options="office.id as office.name for office in offices" value="{{office.id}}"></select>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{ 'label.input.openedon' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="openingDate" sort type="text" datepicker-pop="dd MMMM yyyy" ng-model="first.date" class="form-control" is-open="opened" min="minDat()" max="restrictDate"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{ 'label.input.externalid' | translate }}</label>
					<div class="col-sm-4">
						<input id="externalId" type="text" name="externalId" class="form-control" ng-model="formData.externalId">
					</div>
				</div>
				<div class="ca-form-actions">
					<a id="cancel" href="#/offices" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='CREATE_OFFICE'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
