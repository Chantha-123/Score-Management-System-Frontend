<div class="content-container" ng-controller="HoldSavingsAccountController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.holdaccount' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-piggy-bank"></i>
				<a href="#/viewsavingaccount/{{savingsId}}">{{'label.anchor.viewsavingsaccount' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">

		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-lock"></i> {{'label.heading.hold' | translate}}
		</div>

		<form class="form-horizontal" name="holdaccountform" novalidate="" ng-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3" for="holdOption">{{ 'label.input.hold' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="holdOption" ng-model="holdOption" name="holdOption" class="form-control" ng-change="holdChange(holdOption)">
							<option class="displaynone" value="">{{'label.selectone' | translate}}</option>
							<option value="savingsAccountBlock">{{'label.savingsaccountblock' | translate}}</option>
							<option value="savingsAccountUnBlock">{{'label.savingsaccountunblock' | translate}}</option>
							<option value="debitTransactionFreeze">{{'label.debittransactionfreeze' | translate}}</option>
							<option value="debitTransactionUnFreeze">{{'label.debittransactionunfreeze' | translate}}</option>
							<option value="creditTransactionFreeze">{{'label.credittransactionfreeze' | translate}}</option>
							<option value="creditTransactionUnFreeze">{{'label.credittransactionunfreeze' | translate}}</option>
							<option value="savingsTransactionFreeze">{{'label.savingsTransactionfreeze' | translate}}</option>
						</select>
					</div>
				</div>
				<div class="form-group" ng-show="showHoldAccount">
					<label class="control-label col-sm-3" for="transactionAmount">{{'label.input.transactionamount' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="transactionAmount" type="text" name="transactionAmount" ng-model="formData.transactionAmount"
							   required="required" class="form-control" late-Validate/>
					</div>
					<div class="col-sm-2" style="padding-top:6px;">
						<label class="checkbox" style="display:flex;align-items:center;gap:6px;">
							<input id="lien" type="checkbox" ng-model="formData.lien">
							{{'label.input.Lein' | translate}}
							<i class="fa fa-question-circle" uib-tooltip="{{'label.tooltip.hold.lein' | translate}}" tooltip-append-to-body="true"></i>
						</label>
					</div>
				</div>
				<div class="form-group" ng-show="showHoldAccount">
					<label class="control-label col-sm-3">{{ 'label.input.transactiondate' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="transactiondate" sort type="text" datepicker-pop="dd MMMM" ng-model="formData.transactionDate"
							   is-open="opened" class="form-control"/>
					</div>
				</div>
				<div class="form-group" ng-show="showHoldReasons">
					<label class="control-label col-sm-3" for="reasons">{{'label.input.reasons' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="reasons" ng-model="formData.reasonForBlock"
								ng-options="reason.name as reason.name for reason in reasons"
								value="{{reason.name}}" required="required" class="form-control">
							<option style="display:none" value="">{{'label.menu.selectone' | translate}}</option>
						</select>
					</div>
				</div>
				<div class="ca-form-actions">
					<button id="cancel" type="reset" class="btn btn-default btn-sm" ng-click="cancel()">{{ 'label.button.cancel' | translate }}</button>
					<button type="submit" class="btn btn-primary btn-sm">{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>

	</div><!-- /.ca-card -->

</div>
