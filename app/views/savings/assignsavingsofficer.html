<div class="content-container" ng-controller="AssignSavingsOfficerController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.assignsavingsofficer' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-piggy-bank"></i>
				<a href="#/viewsavingaccount/{{accountNo}}">{{'label.anchor.viewsavingsaccount' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">

		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-user-plus"></i> {{'label.heading.assignsavingsofficer' | translate}}
		</div>

		<form class="form-horizontal" name="assignsavingsofficerform" novalidate="" ng-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3" for="toSavingsOfficerId">{{ 'label.input.tosavingsofficer' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select chosen="fieldOfficers" id="toSavingsOfficerId" ng-model="formData.toSavingsOfficerId" class="form-control"
								ng-options="fieldOfficer.id as fieldOfficer.displayName for fieldOfficer in fieldOfficers" value="{{fieldOfficer.id}}">
							<option style="display:none" value="">{{'label.selectsavingsofficer' | translate}}</option>
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3" for="assignmentDate">{{ 'label.input.assignmentdate' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input class="form-control" sort id="assignmentDate" type="text" datepicker-pop="dd MMMM yyyy"
							   ng-model="formData.assignmentDate" is-open="opened" min="minDate"/>
					</div>
				</div>
				<div class="ca-form-actions">
					<button id="cancel" type="reset" class="btn btn-default btn-sm" ng-click="cancel()">{{ 'label.button.cancel' | translate }}</button>
					<button id="save" type="submit" ng-disabled="!assignsavingsofficerform.$valid"
							has-permission='UPDATESAVINGSOFFICER_SAVINGSACCOUNT'
							class="btn btn-primary btn-sm">{{'label.button.save' | translate}}
					</button>
				</div>
			</fieldset>
		</form>

	</div><!-- /.ca-card -->

</div>
