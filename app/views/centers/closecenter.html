<div class="content-container" data-ng-controller="CloseCenterController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'closecenter' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-building"></i>
				<a href="#/viewcenter/{{center.id}}">{{'label.anchor.viewcenter' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-times-circle"></i> {{'closecenter' | translate}}
		</div>
		<form class="form-horizontal">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">{{ 'label.input.closuredate' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="closureDate" type="text" datepicker-pop="dd MMMM yyyy" ng-model="first.date" is-open="opened"
							min="'2000-01-01'" max="restrictDate" class="form-control"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{ 'label.input.closurereason' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="closureReasonId" ng-model="formData.closureReasonId" class="form-control"
							ng-options="reason.id as reason.name for reason in template.closureReasons" value="{{reason.id}}">
						</select>
					</div>
				</div>
				<div class="ca-form-actions">
					<a id="cancel" href="#/viewcenter/{{center.id}}" class="btn btn-default btn-sm">{{ 'label.button.cancel' | translate }}</a>
					<button id="save" type="button" class="btn btn-primary btn-sm" data-ng-click="closeGroup()" has-permission='CLOSE_CENTER'>{{ 'label.button.confirm' | translate }}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
