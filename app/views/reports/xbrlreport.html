<div class="content-container" ng-controller="XBRLReportController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.heading.xbrl.report' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-file-code-o"></i>
				<a href="#/xbrl">XBRL</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-file-text-o"></i> {{'label.heading.xbrl.report' | translate}}
		</div>
		<div id="xbrlreport"></div>
		<div class="ca-form-actions">
			<a href="#/xbrl" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
			<button ng-click="saveReport()" class="btn btn-primary btn-sm">{{'label.button.save' | translate}}</button>
		</div>
	</div><!-- /.ca-card -->

</div>
