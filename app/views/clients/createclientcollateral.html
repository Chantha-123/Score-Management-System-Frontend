<div class="content-container" ng-controller="CreateClientCollateralController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{ 'label.heading.createcollateral' | translate }}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-user"></i>
				<a ng-href="#/viewclient/{{clientId}}">{{'label.anchor.viewclient' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading">
			<i class="fa fa-archive"></i> {{ 'label.heading.createcollateral' | translate }}
		</div>

		<form name="createcollateralform" class="ca-form form-horizontal" ng-submit="submit()">
			<api-validate></api-validate>

			<div class="form-group">
				<label class="control-label col-sm-3" for="collateralId">{{ 'label.input.collateralSelection' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select id="collateralId" ng-model="formData.collateralId" class="form-control"
							ng-options="collateral.id as collateral.name for collateral in collaterals"
							value="{{collateral.id}}" ng-change="collateralProductChange(formData.collateralId)">
					</select>
				</div>
			</div>

			<div ng-show="disabled == false">

				<div class="ca-section-heading">
					<i class="fa fa-info-circle"></i> {{ 'label.heading.collateraldetails' | translate}}
				</div>

				<div class="form-group">
					<label class="control-label col-sm-3" for="name">{{ 'label.input.name' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="name" name="name" type="text" class="form-control" ng-model="formData.name" required disabled>
					</div>
				</div>

				<div class="form-group" ng-if="disabled == false">
					<label class="control-label col-sm-3" for="type">{{ 'label.input.type' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="type" name="type" type="text" class="form-control" ng-model="formData.type" disabled>
					</div>
				</div>

				<div class="form-group" ng-if="disabled == false">
					<label class="control-label col-sm-3" for="unitType">{{ 'label.input.unittype' | translate }}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="unitType" class="form-control" ng-model="formData.unitType" disabled>
					</div>
				</div>

				<div class="form-group" ng-if="disabled == false">
					<label class="control-label col-sm-3" for="basePrice">{{'label.input.baseprice' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="basePrice" name="basePrice" type="text" ng-model="formData.basePrice" class="form-control" number-format disabled/>
					</div>
				</div>

				<div class="form-group" ng-if="disabled == false">
					<label class="control-label col-sm-3" for="pctToBase">{{'label.input.pcttobase' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="pctToBase" name="pctToBase" type="text" ng-model="formData.pctToBase" class="form-control" number-format disabled/>
					</div>
				</div>

				<div class="form-group" ng-if="disabled == false">
					<label class="control-label col-sm-3" for="quantity">{{'label.input.quantity' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="quantity" name="quantity" type="text" ng-model="formData.quantity"
							   ng-change="updateValues()" class="form-control" number-format required late-Validate/>
						<form-validate valattributeform="createcollateralform" valattribute="quantity"/>
					</div>
				</div>

				<div class="form-group" ng-if="disabled == false">
					<label class="control-label col-sm-3" for="total">{{'label.input.total' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="total" name="total" type="text" ng-model="formData.total" class="form-control" number-format required disabled/>
					</div>
				</div>

				<div class="form-group" ng-if="disabled == false">
					<label class="control-label col-sm-3" for="totalCollateral">{{'label.input.totalCollateralValue' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<input id="totalCollateral" name="totalCollateral" type="text" ng-model="formData.totalCollateral" class="form-control" number-format required disabled/>
					</div>
				</div>

				<div class="ca-form-actions" ng-if="disabled == false">
					<button id="cancel" type="reset" class="btn btn-default btn-sm" ng-click="cancel()">{{ 'label.button.cancel' | translate }}</button>
					<button id="save" type="submit" has-permission='CREATE_CLIENT_COLLATERAL' class="btn btn-primary btn-sm">
						<i class="fa fa-check"></i> {{ 'label.button.save' | translate }}
					</button>
				</div>

			</div>

		</form>
	</div>

</div>
