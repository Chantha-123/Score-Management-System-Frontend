<div class="content-container" ng-controller="CreateClientController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.heading.uploadclientdocument' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-users"></i>
				<a href="#/clients">{{'label.anchor.clients' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-user"></i>
				<a href="#/viewclient/{{clientId}}">{{'label.anchor.viewclient' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading">
			<i class="fa fa-cloud-upload"></i> {{'label.heading.uploadclientdocument' | translate}}
		</div>

		<form name="clientdocumentform" novalidate="" class="ca-form form-horizontal"
			  ng-controller="ClientDocumentController" rc-submit="submit()">
			<api-validate></api-validate>

			<div class="form-group">
				<label class="control-label col-sm-3" for="name">{{'label.input.name' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select id="name" ng-model="formData.name"
							ng-options="documenttype.name as documenttype.name for documenttype in documenttypes"
							value="{{documenttype.name}}" required="required" class="form-control">
						<option style="display:none" value="">{{'label.menu.selectone' | translate}}</option>
					</select>
					<form-validate valattributeform="clientdocumentform" valattribute="name"/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{'label.input.description' | translate}}</label>
				<div class="col-sm-4">
					<textarea rows="3" ng-model="formData.description" class="form-control"></textarea>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="file">{{'label.input.selectfile' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input type="file" id="file" ngf-select="onFileSelect($files)" style="padding-top:6px;">
				</div>
			</div>

			<div class="ca-form-actions">
				<a id="cancel" href="#/viewclient/{{clientId}}" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
				<button id="save" type="submit" has-permission='CREATE_DOCUMENT' class="btn btn-primary btn-sm">
					<i class="fa fa-cloud-upload"></i> {{'label.button.save' | translate}}
				</button>
			</div>

		</form>
	</div>

</div>
