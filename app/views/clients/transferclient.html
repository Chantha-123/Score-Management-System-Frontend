<div class="content-container" ng-controller="TransactionClientController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.transferclient' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-users"></i>
				<a href="#/clients">{{'label.anchor.clients' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-user"></i>
				<a href="#/viewclient/{{clientId}}">{{'label.anchor.viewclient' | translate}}</a>
			</span>
		</div>
	</div>

	<api-validate></api-validate>

	<div class="ca-card">
		<div class="ca-section-heading">
			<i class="fa fa-exchange"></i> {{'label.anchor.transferclient' | translate}}
		</div>

		<form class="ca-form form-horizontal" ng-submit="submit()">

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.office' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select id="destinationOfficeId" ng-model="formData.destinationOfficeId" class="form-control"
							ng-options="office.id as office.name for office in offices" value="{{office.id}}">
					</select>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.transfer.date' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input id="transferDate" type="text" name="transferDate" datepicker-pop="dd MMMM yyyy"
						   class="form-control" ng-model="formData.transferDate" is-open="opened"
						   min="'2000-01-01'" max="restrictDate" autocomplete="off"/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{'label.input.notes' | translate}}</label>
				<div class="col-sm-4">
					<textarea class="form-control" rows="3" ng-model="formData.note"></textarea>
				</div>
			</div>

			<div class="ca-form-actions">
				<a href='#/viewclient/{{clientId}}' class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
				<button id="save" type="submit" has-permission='PROPOSETRANSFER_CLIENT' class="btn btn-primary btn-sm">
					<i class="fa fa-check"></i> {{'label.button.save' | translate}}
				</button>
			</div>

		</form>
	</div>

</div>
