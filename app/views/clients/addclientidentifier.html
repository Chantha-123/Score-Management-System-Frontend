<div class="content-container" ng-controller="ClientIdentifierController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.heading.addclientidentifier' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-users"></i>
				<a href="#/clients">{{'label.anchor.clients' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-user"></i>
				<a href="#/viewclient/{{clientId}}">{{'label.anchor.viewclient' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading">
			<i class="fa fa-id-card"></i> {{'label.heading.addclientidentifier' | translate}}
		</div>

		<form name="clientidentifierform" novalidate="" class="ca-form form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>

			<div class="form-group">
				<label class="control-label col-sm-3" for="documentTypeId">{{'label.input.documenttype' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select id="documentTypeId" ng-model="formData.documentTypeId"
							ng-options="documenttype.id as documenttype.name for documenttype in documenttypes"
							value="{{documenttype.id}}" required="required" class="form-control">
					</select>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="status">{{'label.input.status' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select id="status" ng-model="formData.status"
							ng-options="status.label as status.label for status in statusTypes"
							value="{{status.label}}" required="required" class="form-control">
					</select>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="documentKey">{{'label.input.uniqueidentification' | translate}}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input id="documentKey" type="text" name="identification" ng-model="formData.documentKey"
						   required="required" class="form-control" late-Validate/>
					<form-validate valattributeform="clientidentifierform" valattribute="identification"/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3" for="description">{{'label.input.description' | translate}}</label>
				<div class="col-sm-4">
					<textarea id="description" rows="3" ng-model="formData.description" class="form-control"></textarea>
				</div>
			</div>

			<div class="ca-form-actions">
				<a id="cancel" href="#/viewclient/{{clientId}}" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
				<button id="save" type="submit" has-permission='CREATE_CLIENTIDENTIFIER' class="btn btn-primary btn-sm">
					<i class="fa fa-check"></i> {{'label.button.save' | translate}}
				</button>
			</div>

		</form>
	</div>

</div>
