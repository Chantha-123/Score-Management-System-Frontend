<div class="content-container" ng-controller="PayClientChargeController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{ 'label.button.paycharge' | translate }}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-user"></i>
				<a ng-href="#/viewclient/{{clientId}}">{{'label.anchor.viewclient' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading">
			<i class="fa fa-dollar"></i> {{ 'label.button.paycharge' | translate }}
		</div>

		<form name="payclientchargeform" novalidate="" class="ca-form form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.amount' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input id="amount" type="text" name="amount" ng-model="formData.amount" class="form-control"
						   number-format required ng-late-Validate/>
					<form-validate valattributeform="payclientchargeform" valattribute="amount"/>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.transactiondate' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<input sort type="text" datepicker-pop={{df}}
						   ng-model="paymentDate" is-open="opened" class="form-control"/>
				</div>
			</div>

			<div class="ca-form-actions">
				<a id="cancel" href="#/viewclient/{{cancelRoute}}" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
				<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='PAY_CLIENTCHARGE'>
					<i class="fa fa-check"></i> {{'label.button.save' | translate}}
				</button>
			</div>

		</form>
	</div>

</div>
