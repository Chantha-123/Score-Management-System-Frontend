<div class="content-container" data-ng-controller="AddRoleController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{ 'label.heading.addrole' | translate }}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-users"></i>
				<a href="#/viewgroup/{{group.id}}">{{'label.anchor.viewgroup' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-tag"></i> {{ 'label.heading.addrole' | translate }}
		</div>
		<api-validate></api-validate>
		<form class="form-horizontal" data-ng-controller="AddRoleController">
			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.client' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select id="clientId" ng-model="formData.clientId" class="form-control"
						ng-options="client.id as client.displayName for client in clients" value="{{client.id}}">
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-3">{{ 'label.input.role' | translate }}<span class="required">*</span></label>
				<div class="col-sm-4">
					<select id="role" ng-model="formData.role" ng-options="role.id as role.name for role in roles"
						value="{{role.id}}" class="form-control"></select>
				</div>
			</div>
			<div class="ca-form-actions">
				<a href="#/viewgroup/{{group.id}}" class="btn btn-default btn-sm">{{ 'label.button.cancel' | translate }}</a>
				<button type="button" class="btn btn-primary btn-sm" data-ng-click="addrole()" has-permission='ASSIGNROLE_GROUP'>{{ 'label.button.add' | translate }}</button>
			</div>
		</form>
	</div><!-- /.ca-card -->

</div>
