<div class="content-container" ng-controller="EditMeetingBasedOnMeetingDatesController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.editmeeting' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-list"></i>
				<a href="#/groups">{{'label.anchor.groups' | translate}}</a>
			</span>
			<span class="ca-hero-chip" ng-show="entityType=='groups'"><i class="fa fa-users"></i>
				<a href="#/viewgroup/{{groupOrCenterId}}">{{'label.anchor.viewgroup' | translate}}</a>
			</span>
			<span class="ca-hero-chip" ng-show="entityType=='centers'"><i class="fa fa-building"></i>
				<a href="#/viewcenter/{{groupOrCenterId}}">{{'label.anchor.viewcenter' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-calendar"></i> {{'label.anchor.editmeeting' | translate}}
		</div>
		<api-validate></api-validate>
		<form ng-submit="submit()" class="form-horizontal">
			<div class="form-group">
				<label class="control-label col-sm-3">{{'label.input.existingmeetingdates' | translate}}</label>
				<div class="col-sm-4">
					<select id="presentmeetingdateId" ng-model="formData.presentMeetingDate" class="form-control"
						ng-options="presentmeetingdate for presentmeetingdate in presentmeetingdates" value="{{presentmeetingdate}}">
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-3">{{'label.input.revisedmeetingdates' | translate}}</label>
				<div class="col-sm-4">
					<input id="newmeetingdateId" type="text" name="newmeetingdate" datepicker-pop="dd MMMM yyyy"
						ng-model="formData.newMeetingDate" class="form-control"/>
				</div>
			</div>
			<div class="ca-form-actions">
				<a id="cancel" ng-show="entityType=='groups'" class="btn btn-default btn-sm" href="#/viewgroup/{{groupOrCenterId}}">{{'label.button.cancel' | translate}}</a>
				<a ng-hide="entityType=='groups'" class="btn btn-default btn-sm" href="#/viewcenter/{{groupOrCenterId}}">{{'label.button.cancel' | translate}}</a>
				<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='CREATE_MEETING'>{{'label.button.save' | translate}}</button>
			</div>
		</form>
	</div><!-- /.ca-card -->

</div>
