<div class="content-container" ng-controller="AddFinancialMappingController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">{{'label.anchor.addfinancialmapping' | translate}}</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-book"></i>
				<a href="#/accounting">{{'label.anchor.accounting' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-map-o"></i>
				<a href="#/financialactivityaccountmappings">{{'label.anchor.financialactivity.accountmappings' | translate}}</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-plus-circle"></i> {{'label.heading.add.financial.activity.mapping' | translate}}
		</div>
		<form name="createfinancialmappingform" novalidate="" class="form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.financial.activity.type' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="financialActivityId" ng-model="formData.financialActivityId" class="form-control"
							ng-options="activityOption.id as activityOption.name | translate for activityOption in financialActivityOptions"
							value="{{activityOption.id}}"
							ng-change="updateActivityOptions(formData.financialActivityId)">
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.account' | translate}}<span class="required">*</span></label>
					<div class="col-sm-4">
						<select chosen="accountOptions" id="glAccountId" ng-model="formData.glAccountId" class="form-control"
							ng-options="account.id as (account.name +'('+ account.glCode +')') for account in accountOptions"
							value="{{account.id}}" name="glAccountId" required>
						</select>
						<form-validate valattributeform="createfinancialmappingform" valattribute="glAccountId"/>
					</div>
				</div>
				<div class="ca-form-actions">
					<a id="cancel" href="#/financialactivityaccountmappings" class="btn btn-default btn-sm">{{'label.button.cancel' | translate}}</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm" has-permission='CREATE_FINANCIALACTIVITYACCOUNT'>{{'label.button.save' | translate}}</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
