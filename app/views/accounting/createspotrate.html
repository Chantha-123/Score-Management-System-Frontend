<div class="content-container" ng-controller="CreateSpotRateController">

	<!-- Hero -->
	<div class="ca-page-hero">
		<h2 class="ca-page-title">Create Spot Rate</h2>
		<div>
			<span class="ca-hero-chip"><i class="fa fa-book"></i>
				<a href="#/accounting">{{'label.anchor.accounting' | translate}}</a>
			</span>
			<span class="ca-hero-chip"><i class="fa fa-dollar"></i>
				<a href="#/spotrates">Daily Spot Rates</a>
			</span>
		</div>
	</div>

	<div class="ca-card">
		<div class="ca-section-heading" style="margin-top:0;">
			<i class="fa fa-plus-circle"></i> Create Daily Spot Rate
		</div>
		<form name="createSpotRateForm" novalidate="" class="form-horizontal" rc-submit="submit()">
			<api-validate></api-validate>
			<fieldset>
				<div class="form-group">
					<label class="control-label col-sm-3">Office <span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="officeId" ng-model="formData.officeId" class="form-control"
							ng-options="office.id as office.name for office in offices"
							value="{{office.id}}" name="officeId" required></select>
						<form-validate valattributeform="createSpotRateForm" valattribute="officeId"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">{{'label.input.currency' | translate}} <span class="required">*</span></label>
					<div class="col-sm-4">
						<select id="currencyCode" ng-model="formData.currencyCode" class="form-control"
							ng-options="currency.code as currency.name for currency in currencyOptions"
							value="{{currency.code}}" name="currencyCode" required></select>
						<form-validate valattributeform="createSpotRateForm" valattribute="currencyCode"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">Rate Date <span class="required">*</span></label>
					<div class="col-sm-4">
						<input class="form-control" id="rateDate" name="rateDate" type="text"
							datepicker-pop="dd MMMM yyyy" ng-model="first.rateDate" is-open="opened" max="restrictDate" required/>
						<form-validate valattributeform="createSpotRateForm" valattribute="rateDate"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">Spot Rate <span class="required">*</span></label>
					<div class="col-sm-4">
						<input type="number" id="spotRate" name="spotRate" step="0.0001"
							ng-model="formData.spotRate" class="form-control" required late-Validate/>
						<form-validate valattributeform="createSpotRateForm" valattribute="spotRate"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">Buying Rate <span class="required">*</span></label>
					<div class="col-sm-4">
						<input type="number" id="buyingRate" name="buyingRate" step="0.0001"
							ng-model="formData.buyingRate" class="form-control" required late-Validate/>
						<form-validate valattributeform="createSpotRateForm" valattribute="buyingRate"/>
					</div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3">Selling Rate <span class="required">*</span></label>
					<div class="col-sm-4">
						<input type="number" id="sellingRate" name="sellingRate" step="0.0001"
							ng-model="formData.sellingRate" class="form-control" required late-Validate/>
						<form-validate valattributeform="createSpotRateForm" valattribute="sellingRate"/>
					</div>
				</div>
				<div class="ca-form-actions">
					<a id="cancel" href="#/spotrates" class="btn btn-default btn-sm">Cancel</a>
					<button id="save" type="submit" class="btn btn-primary btn-sm">Save</button>
				</div>
			</fieldset>
		</form>
	</div><!-- /.ca-card -->

</div>
